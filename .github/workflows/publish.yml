# Publishes the wheels of a GitHub release to TestPyPI, then PyPI.
#
# The wheels are built and attached to the release before it is published; this
# workflow only uploads them. Trusted publishing: PyPI trusts this repository and
# this file's name, so no token is stored. Keep the filename stable.
#
# Rerun for an existing release: Actions > publish > Run workflow, with its tag.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        required: true

permissions: {}

jobs:
  testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir dist
          count=$(find dist -name "simscale_cadlib-${TAG#v}-*.whl" | wc -l)
          if [ "$count" -ne 4 ] || [ "$(ls dist | wc -l)" -ne 4 ]; then
            echo "expected 4 simscale_cadlib-${TAG#v} wheels on release $TAG:"; ls dist; exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
